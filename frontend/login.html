<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS - Iniciar Sesión</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 24px;">
        <img src="img/logo.jpeg" alt="Mundo Tech Logo" style="height: 48px; width: auto;">
        <h1>Mundo Tech</h1>
      </div>
      <form class="login-form" id="loginForm">
        <input type="text" id="username" placeholder="Usuario" required autocomplete="username">
        <input type="password" id="password" placeholder="Contraseña" required autocomplete="current-password">
        <button type="submit">Ingresar</button>
      </form>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
