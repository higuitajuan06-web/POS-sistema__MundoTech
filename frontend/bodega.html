<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bodega - POS Sistema</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>

  <header class="app-header">
    <div style="display: flex; align-items: center; gap: 12px;">
      <img src="img/logo.jpeg" alt="Mundo Tech Logo" style="height: 36px; width: auto;">
      <h1>Mundo Tech - Bodega</h1>
    </div>
  </header>

  <main class="app-layout">

    <!-- SIDEBAR DE NAVEGACIÓN -->
    <nav class="app-sidebar" id="sidebar-container">
      <!-- El sidebar se genera dinámicamente según el rol del usuario -->
    </nav>

    <!-- PANEL PRINCIPAL: bodega -->
    <section class="panel-catalogo">
      <!-- BARRA DE BÚSQUEDA -->
      <div class="barra-busqueda">
        <div class="input-busqueda">
          <i class="bi bi-search"></i>
          <input type="text" id="buscar-bodega" placeholder="Buscar por nombre o SKU...">
        </div>
      </div>

      <!-- TARJETAS DE RESUMEN -->
      <div class="resumen-bodega">
        <div class="resumen-card">
          <i class="bi bi-box-seam"></i>
          <div class="resumen-info">
            <span class="resumen-label">Total productos</span>
            <span class="resumen-valor" id="resumen-total-productos">0</span>
          </div>
        </div>
        <div class="resumen-card" id="resumen-stock-bajo-card">
          <i class="bi bi-exclamation-triangle"></i>
          <div class="resumen-info">
            <span class="resumen-label">Stock bajo</span>
            <span class="resumen-valor" id="resumen-stock-bajo">0</span>
          </div>
        </div>
        <div class="resumen-card">
          <i class="bi bi-currency-dollar"></i>
          <div class="resumen-info">
            <span class="resumen-label">Valor inventario</span>
            <span class="resumen-valor" id="resumen-valor-inventario">$0</span>
          </div>
        </div>
      </div>

      <!-- CONTENEDOR DE CATEGORÍAS Y PRODUCTOS -->
      <div id="bodega-categorias">
        <!-- Las categorías y productos se insertan aquí por JS -->
      </div>
    </section>

  </main>

  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/bodega.js"></script>
  <script src="js/cierre-caja.js"></script>
</body>
</html>
