<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Productos - POS Sistema</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <header class="app-header">
    <div style="display: flex; align-items: center; gap: 12px;">
      <img src="img/logo.jpeg" alt="Mundo Tech Logo" style="height: 36px; width: auto;">
      <h1>Mundo Tech - Admin Productos</h1>
    </div>
  </header>

  <main class="app-layout">

    <!-- SIDEBAR DE NAVEGACIÓN -->
    <nav class="app-sidebar" id="sidebar-container">
      <!-- El sidebar se genera dinámicamente según el rol del usuario -->
    </nav>

    <!-- PANEL PRINCIPAL: lista de productos -->
    <section class="panel-catalogo" aria-hidden="false">
      <!-- INPUT DE ESCÁNER DE CÓDIGO DE BARRAS -->
      <div class="barra-escaner">
        <div class="input-escaner">
          <i class="bi bi-upc-scan"></i>
          <input type="text" id="input-escaner" placeholder="Escanear código de barras..." autofocus>
        </div>
      </div>

      <!-- BARRA DE BÚSQUEDA Y BOTÓN AGREGAR -->
      <div class="barra-busqueda">
        <button class="btn-agregar" id="btn-agregar-producto">
          <i class="bi bi-plus-lg"></i> Agregar producto
        </button>
      </div>

      <!-- TABLA DE PRODUCTOS -->
      <div class="tabla-productos-container">
        <table class="tabla-productos">
          <thead>
            <tr>
              <th>Imagen</th>
              <th>Código</th>
              <th>Nombre</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Comisión</th>
              <th>Stock</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-productos-body">
            <!-- Los productos se insertan aquí por JS -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- MODAL FORMULARIO AGREGAR/EDITAR -->
  <div class="modal" id="modal-producto">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-producto-titulo">Agregar producto</h2>
        <button class="modal-close" id="modal-producto-close">&times;</button>
      </div>
      <form id="form-producto" class="modal-body">
        <input type="hidden" id="producto-id">
        
        <div class="form-group">
          <label for="producto-sku">Código/SKU</label>
          <input type="text" id="producto-sku" required>
        </div>
        
        <div class="form-group">
          <label for="producto-nombre">Nombre *</label>
          <input type="text" id="producto-nombre" required>
        </div>
        
        <div class="form-group">
          <label for="producto-categoria">Categoría</label>
          <select id="producto-categoria" required>
            <option value="">Seleccionar categoría</option>
            <!-- Las categorías se insertan aquí por JS -->
          </select>
        </div>
        
        <div class="form-group">
          <label for="producto-precio">Precio de venta *</label>
          <input type="number" id="producto-precio" step="0.01" min="0" required>
        </div>

        <div class="form-group">
          <label for="producto-comision">% Comisión</label>
          <input type="number" id="producto-comision" step="0.01" min="0" max="100" value="0">
        </div>
        
        <div class="form-group">
          <label for="producto-stock">Stock inicial</label>
          <input type="number" id="producto-stock" min="0" value="0">
        </div>
        
        <div class="form-group">
          <label for="producto-stock-min">Stock mínimo</label>
          <input type="number" id="producto-stock-min" min="0" value="5">
        </div>
        
        <div class="form-group">
          <label for="producto-imagen">Imagen del producto</label>
          <input type="file" id="producto-imagen" accept="image/*">
          <div id="imagen-preview" class="imagen-preview"></div>
        </div>
        
        <div class="modal-footer">
          <button type="button" class="btn-cancelar" id="btn-cancelar-producto">Cancelar</button>
          <button type="submit" class="btn-guardar">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/admin-productos.js"></script>
  <script src="js/cierre-caja.js"></script>
</body>
</html>
